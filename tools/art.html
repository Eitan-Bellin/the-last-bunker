<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Art pipeline</title>
  <style>
    body { background: #15171b; color: #e6e1d6; font: 14px/1.5 system-ui, sans-serif; margin: 16px; }
    button { font: inherit; padding: 6px 14px; margin-inline-end: 8px; }
    #log { white-space: pre-wrap; font-family: ui-monospace, monospace; font-size: 12px; color: #a39d90; }
    #grid { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 12px; }
    figure { margin: 0; background: #1d2026; padding: 6px; border-radius: 4px; position: relative; }
    figure img { display: block; max-width: 360px; height: auto; }
    figcaption { font-size: 12px; color: #a39d90; margin-top: 4px; }
    .spot { position: absolute; border: 1px solid rgba(255,255,255,0.7); border-radius: 50%; pointer-events: none; transform: translate(-50%, -50%); }
  </style>
</head>
<body>
  <h1>Art pipeline</h1>
  <button id="run">Process all</button>
  <label><input type="checkbox" id="spots" checked /> show light spots</label>
  <div id="log"></div>
  <div id="grid"></div>
  <script type="module" src="./art.ts"></script>
</body>
</html>
