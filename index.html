  <title>The Last Bunker | הבונקר האחרון</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Karantina:wght@400;700&family=Rubik:wght@400;500;600;700;800&family=Secular+One&display=swap" rel="stylesheet" />
</head>
<body>
  <canvas id="game-canvas"></canvas>
  <!-- Shown from the very first paint; main.ts fades it out once the game is ready (the HUD used to show zeros on a black screen). -->
  <div id="splash" style="position:fixed;inset:0;z-index:100001;display:flex;align-items:center;justify-content:center;background:#07090c"><div class="splash-mark" style="font:700 36px Rubik,system-ui,sans-serif;color:#f1d58a">הבונקר האחרון</div></div>
  <script>
    // [plan4:UX-22] The splash speaks the language the game will open in (same rule as main.ts: a saved choice, else the device's; Hebrew when unsure).
    try {
      var l = localStorage.getItem('lastbunker_lang');
      if (l === 'en' || (!l && /^en/i.test(navigator.language || '') && !/^he/i.test(navigator.language || ''))) document.querySelector('.splash-mark').textContent = 'The Last Bunker';
    } catch (e) { /* storage blocked: Hebrew */ }
  </script>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
