<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>העיר שמתחת · אב-טיפוס B</title>
  <style>
    html, body { margin: 0; height: 100%; background: #020305; overflow: hidden; font-family: 'Segoe UI', 'Arial Hebrew', Arial, sans-serif; color: #eadfc6; }
    #stage { position: fixed; inset: 0; }
    #hud { position: fixed; top: 12px; right: 12px; left: 12px; display: flex; flex-wrap: wrap; gap: 8px; align-items: flex-start; justify-content: space-between; pointer-events: none; }
    .panel { pointer-events: auto; background: rgba(12, 14, 20, 0.72); border: 1px solid rgba(234, 223, 198, 0.14); border-radius: 10px; padding: 8px 12px; backdrop-filter: blur(6px); box-shadow: 0 6px 24px rgba(0,0,0,0.45); }
    h1 { margin: 0 0 2px; font-size: 15px; font-weight: 700; letter-spacing: 0.4px; }
    .sub { font-size: 11.5px; opacity: 0.7; }
    #levels { display: flex; gap: 4px; align-items: center; }
    #levels span { font-size: 11.5px; opacity: 0.7; margin-inline-end: 4px; }
    #levels button { font: inherit; font-size: 12.5px; color: #eadfc6; background: rgba(255,255,255,0.05); border: 1px solid rgba(234,223,198,0.18); border-radius: 7px; padding: 6px 10px; min-width: 40px; min-height: 34px; cursor: pointer; }
    #levels button.on { background: #d1a62b; color: #16120a; border-color: #d1a62b; font-weight: 700; }
    #fps { position: fixed; bottom: 10px; left: 12px; font: 11px ui-monospace, Consolas, monospace; opacity: 0.55; direction: ltr; pointer-events: none; }
    #help { position: fixed; bottom: 10px; right: 12px; font-size: 11.5px; opacity: 0.6; pointer-events: none; max-width: 60vw; }
    #hint { position: fixed; bottom: 42px; left: 50%; transform: translateX(-50%); font-size: 13px; background: rgba(12,14,20,0.8); padding: 6px 12px; border-radius: 8px; opacity: 0; transition: opacity .4s; pointer-events: none; }
  </style>
</head>
<body>
  <div id="stage"></div>
  <div id="hud">
    <div class="panel"><h1>העיר שמתחת</h1><div class="sub">אב-טיפוס B · איזומטרי 2:1 · חתך עם קירות חתוכים</div></div>
    <div class="panel" id="levels"><span>חתך</span>
      <button data-l="0" class="on">הכל</button><button data-l="1">1</button><button data-l="2">2</button><button data-l="3">3</button>
    </div>
  </div>
  <div id="help">גרירה: הזזה · גלגלת / צביטה: זום · הקשה על הערפל: חשיפה · מקשים 0-3: חתך</div>
  <div id="hint"></div>
  <div id="fps"></div>
  <script type="module" src="./main.ts"></script>
</body>
</html>
