<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>העיר שמתחת · אב־טיפוס A</title>
  <style>
    html, body { margin: 0; height: 100%; background: #05060a; overflow: hidden; overscroll-behavior: none; }
    #stage { position: fixed; inset: 0; }
    #stage canvas { display: block; }
    #hud { position: fixed; inset: 0; pointer-events: none; font-family: Rubik, Heebo, 'Segoe UI', Arial, sans-serif; color: #f0dcb4; }
    .panel {
      position: absolute; top: max(12px, env(safe-area-inset-top)); right: 12px; max-width: min(360px, calc(100vw - 24px));
      pointer-events: auto; background: rgba(14, 12, 10, 0.72); border: 1px solid rgba(220, 170, 100, 0.28);
      border-radius: 12px; padding: 10px 14px; backdrop-filter: blur(6px); box-shadow: 0 8px 30px rgba(0,0,0,.5);
    }
    .panel h1 { margin: 0 0 2px; font-size: 16px; letter-spacing: .3px; }
    .panel p { margin: 0 0 8px; font-size: 12px; color: #b9a684; line-height: 1.45; }
    .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    button {
      font: inherit; font-size: 12px; color: #1a120a; background: #e0b070; border: 0; border-radius: 8px;
      padding: 7px 12px; min-height: 32px; cursor: pointer;
    }
    button.ghost { background: transparent; color: #e0b070; border: 1px solid rgba(224,176,112,.5); }
    #fps { font-size: 11px; color: #8a7a62; margin-inline-start: auto; font-variant-numeric: tabular-nums; }
  </style>
</head>
<body>
  <div id="stage"></div>
  <div id="hud">
    <div class="panel">
      <h1>העיר שמתחת · אב־טיפוס A</h1>
      <p>חתך צד עמוק, 6 שכבות עומק. גרירה להזזה · גלגלת או צביטה לזום · הקשה על החושך חושפת אותו.</p>
      <div class="row">
        <button id="reveal">חשוף הכול</button>
        <button id="reset" class="ghost">החזר ערפל</button>
        <span id="fps"></span>
      </div>
    </div>
  </div>
  <script type="module" src="./main.ts"></script>
</body>
</html>
