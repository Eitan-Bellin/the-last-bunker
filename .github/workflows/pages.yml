name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Stop before publishing if the code does not type-check or the game logic is broken (a silent break once made every simulation useless).
      - run: npx tsc --noEmit
      - run: node tools/sim/smoke.mjs
      - run: node tools/sim/lint.mjs
      - run: npx vite build
      # Performance regression check (tools/perf/run.mjs, budget in tools/perf/budget.json): draw calls, objects drawn, allocation per
      # picture, texture memory. It reports but does not block the deploy (a headless runner can be flaky); remove `continue-on-error`
      # to make it a gate.
      - run: node tools/perf/run.mjs --check --only f8-overview-medium,f24-close-medium,f24-idle-medium --out perf-results.json
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: perf-results
          path: perf-results.json
          if-no-files-found: ignore
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
